<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuditEngine Growth Icon</title>
    <style>
        :root { --background: #ffead1; --red: #ff0808; --black: #030303; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 32px; color: #111827; background: var(--background); font-family: "Trebuchet MS", sans-serif; }
        h1 { margin: 0 0 24px; font-size: 20px; }
        a { color: inherit; text-decoration: none; }
        .project-icon {
    width: 53px;
    height: 53px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.1);
}
.project-icon svg {
    width: 28px;
    height: 28px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.project-icon-preview { padding: 24px; width: fit-content; color: white; background: var(--red); }
    </style>
</head>
<body>
    <main aria-labelledby="svg-label">
        <h1 id="svg-label">AuditEngine Growth Icon</h1>
        <div class="project-icon-preview"><div class="project-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="m4 17 5-5 4 3 7-8m-5 0h5v5"/></svg>
                    </div></div>
    </main>
</body>
</html>
