<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: "Outfit Variable";
  font-style: normal;
  font-weight: 100 900;
  src: url("../../client/node_modules/@fontsource-variable/outfit/files/outfit-latin-wght-normal.woff2") format("woff2");
}
html, body { margin: 0; }
body {
  position: relative;
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: #ffead1;
  color: #030303;
  font-family: "Outfit Variable", "Trebuchet MS", sans-serif;
}
.frame { position: absolute; inset: 36px; border: 3px solid #030303; }
.mark {
  position: absolute; top: 76px; left: 84px;
  display: grid; place-items: center;
  width: 72px; height: 72px; border-radius: 16px;
  background: #030303; color: #ffead1;
  font-size: 48px; font-weight: 800; line-height: 1;
}
.handle {
  position: absolute; top: 96px; left: 176px;
  color: #e60000; font-size: 30px; font-weight: 1000; line-height: 1;
  text-decoration: underline; text-decoration-thickness: 5px; text-underline-offset: 5px;
}
.hello { position: absolute; left: 84px; top: 212px; font-size: 92px; font-weight: 900; letter-spacing: -0.025em; line-height: 1; }
.name {
  position: absolute; left: 84px; top: 318px;
  padding: 14px 40px; border-radius: 16px;
  background: #030303; color: #ffead1;
  font-size: 92px; font-weight: 750; line-height: 1;
}
.tagline { position: absolute; left: 84px; top: 472px; color: #c00000; font-size: 38px; font-weight: 800; line-height: 1; }
.url { position: absolute; left: 84px; bottom: 62px; color: #625d5b; font-size: 24px; font-weight: 600; line-height: 1; }
.record {
  position: absolute; right: 90px; top: 170px;
  width: 330px; height: 290px; border-radius: 50%;
  background: #090b0c;
}
.record img { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="frame"></div>
<div class="mark">T</div>
<div class="handle">nutritiousblueberrymuffins</div>
<div class="hello">Hello, I'm</div>
<div class="name">Tony</div>
<div class="tagline">CPA | Aspiring Software Engineer</div>
<div class="url">nutritiousblueberrymuffins.github.io/personal-website</div>
<div class="record"><img src="../../client/public/assets/hero/vinyl.svg" alt=""></div>
</body>
</html>
