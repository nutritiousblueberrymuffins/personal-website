<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Twitter Icon</title>
    <style>
        :root { --background: #ffead1; --red: #ff0808; --black: #030303; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 32px; color: #111827; background: var(--background); font-family: "Trebuchet MS", sans-serif; }
        h1 { margin: 0 0 24px; font-size: 20px; }
        a { color: inherit; text-decoration: none; }
        .social-links {
    display: flex;
    align-items: center;
    gap: 0.9rem;
}
.social-links a {
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    color: var(--background);
    background: var(--black);
    border-radius: 50%;
    transition: transform 160ms ease, background 160ms ease;
}
.social-links a:hover,
.social-links a:focus-visible {
    background: var(--red);
    transform: translateY(-2px);
}
.social-links svg {
    width: 23px;
    height: 23px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.hero .social-links { gap: 41px; }
.hero .social-links a { width: 45px; height: 45px; }
@media (max-width: 1100px) { .hero .social-links { gap: 28px; } }
    </style>
</head>
<body>
    <main aria-labelledby="svg-label">
        <h1 id="svg-label">Hero Twitter Icon</h1>
        <div class="hero"><div class="social-links"><a href="#" aria-label="Twitter">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M21 5.3c-.7.3-1.4.5-2.2.6a3.8 3.8 0 0 0-6.6 2.6v.9a10.8 10.8 0 0 1-7.8-4s-3.5 7.8 4.4 11.3a11.2 11.2 0 0 1-6.5 1.8c7.9 4.4 17.5 0 17.5-10.1v-.5c.8-.7 1.3-1.4 1.7-2.3l-.5-.3Z"/>
                            </svg>
                        </a></div></div>
    </main>
</body>
</html>
