<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found | Tony</title>
    <link rel="stylesheet" href="./src/styles/designtoken.css">
    <link rel="stylesheet" href="./src/styles/animations.css">
    <link rel="stylesheet" href="./src/styles/site.css">
</head>

<body>

    <header class="site-header">
        <nav class="navigation" aria-label="Primary navigation">
            <a class="logo" href="/" data-home-link>nutritiousblueberrymuffins</a>

            <ul class="nav-links">
                <li><a href="/" data-home-link>Home</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- GitHub Pages serves this file for any unknown URL, at any depth, so the links use
             data-home-link and main.js points them at the site root. -->
        <section class="contact-section" aria-labelledby="not-found-title">
            <h2 id="not-found-title">Page not found</h2>
            <p class="footer-line">That link goes nowhere. Head back to the <a href="/" data-home-link>home page</a>.</p>
        </section>
    </main>

    <script type="module" src="./src/scripts/main.js"></script>
</body>

</html>
