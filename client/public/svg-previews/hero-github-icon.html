<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero GitHub Icon</title>
    <style>
        :root { --background: #ffead1; --red: #ff0808; --black: #030303; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 32px; color: #111827; background: var(--background); font-family: "Trebuchet MS", sans-serif; }
        h1 { margin: 0 0 24px; font-size: 20px; }
        a { color: inherit; text-decoration: none; }
        .social-links {
    display: flex;
    align-items: center;
    gap: 0.9rem;
}
.social-links a {
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    color: var(--background);
    background: var(--black);
    border-radius: 50%;
    transition: transform 160ms ease, background 160ms ease;
}
.social-links a:hover,
.social-links a:focus-visible {
    background: var(--red);
    transform: translateY(-2px);
}
.social-links svg {
    width: 23px;
    height: 23px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.hero .social-links { gap: 41px; }
.hero .social-links a { width: 45px; height: 45px; }
@media (max-width: 1100px) { .hero .social-links { gap: 28px; } }
    </style>
</head>
<body>
    <main aria-labelledby="svg-label">
        <h1 id="svg-label">Hero GitHub Icon</h1>
        <div class="hero"><div class="social-links"><a href="#" aria-label="GitHub">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M9 18.5c-4.5 1.4-4.5-2.3-6.2-2.8m12.4 5.1v-3.5c0-1 .1-1.4-.5-2 2.9-.3 5.9-1.4 5.9-6.3a4.9 4.9 0 0 0-1.3-3.4 4.6 4.6 0 0 0-.1-3.4s-1-.3-3.5 1.3a12.1 12.1 0 0 0-6.4 0C6.8 1.9 5.8 2.2 5.8 2.2a4.6 4.6 0 0 0-.1 3.4A4.9 4.9 0 0 0 4.4 9c0 4.9 3 6 5.9 6.3-.5.5-.6 1.1-.6 2v3.5"/>
                            </svg>
                        </a></div></div>
    </main>
</body>
</html>
