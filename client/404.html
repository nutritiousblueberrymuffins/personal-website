<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#ffffff">
    <title>Page not found | Tony Nguyen</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="./src/styles/designtoken.css">
    <link rel="stylesheet" href="./src/styles/site.css">
    <link rel="stylesheet" href="./src/styles/motion.css">
    <link rel="stylesheet" href="./src/styles/animations.css">
    <!-- Turns on the page's motion (motion.css / motion.js) before the first paint, unless the
         visitor prefers reduced motion. -->
    <script>
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('motion-ok');
        }
    </script>
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- GitHub Pages serves this file for any unknown URL, at any depth, so the links use
         data-home-link and main.js points them at the site root. -->
    <header class="site-header">
        <div class="container">
            <a class="wordmark" href="/" data-home-link><span aria-hidden="true">✦  </span>Tony Nguyen</a>
            <nav aria-label="Primary navigation">
                <ul class="nav-links">
                    <li><a href="/" data-home-link>Home</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main" tabindex="-1">
        <section class="container not-found" aria-labelledby="not-found-title">
            <p class="label-section">404</p>
            <h1 class="heading-section" id="not-found-title">Page not found.</h1>
            <p class="body-large">That link goes nowhere. The thread picks up again on the home page.</p>
            <a class="button button--primary" href="/" data-home-link>Back to the home page</a>
        </section>
    </main>

    <script type="module" src="./src/scripts/main.js"></script>
</body>

</html>
