<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact LinkedIn Icon</title>
    <style>
        :root { --background: #ffead1; --red: #ff0808; --black: #030303; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 32px; color: #111827; background: var(--background); font-family: "Trebuchet MS", sans-serif; }
        h1 { margin: 0 0 24px; font-size: 20px; }
        a { color: inherit; text-decoration: none; }
        .social-links {
    display: flex;
    align-items: center;
    gap: 0.9rem;
}
.social-links a {
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    color: var(--background);
    background: var(--black);
    border-radius: 50%;
    transition: transform 160ms ease, background 160ms ease;
}
.social-links a:hover,
.social-links a:focus-visible {
    background: var(--red);
    transform: translateY(-2px);
}
.social-links svg {
    width: 23px;
    height: 23px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.hero .social-links { gap: 41px; }
.hero .social-links a { width: 45px; height: 45px; }
@media (max-width: 1100px) { .hero .social-links { gap: 28px; } }
    </style>
</head>
<body>
    <main aria-labelledby="svg-label">
        <h1 id="svg-label">Contact LinkedIn Icon</h1>
        <div class="contact-icon-preview"><div class="social-links"><a href="#" aria-label="LinkedIn">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 9.4v8.1 M6.4 6.4v.1 M10.5 17.5v-8.1 M10.5 13c0-2.1 1.3-3.6 3.4-3.6 2.2 0 3.6 1.4 3.6 4.1v4" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a></div></div>
    </main>
</body>
</html>
